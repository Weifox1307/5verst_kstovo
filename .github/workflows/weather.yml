name: Saturday Weather Forecast

on:
  schedule:
    # Запуск каждую субботу в 05:00 UTC (08:00 МСК)
    - cron: '0 5 * * 6'
  workflow_dispatch: # Возможность запустить вручную

jobs:
  send_weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 python-telegram-bot pytz

      - name: Run weather script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
        run: python bot.py --weather
