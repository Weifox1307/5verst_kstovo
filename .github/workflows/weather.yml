name: Friday Weather Forecast

on:
  schedule:
    - cron: '0 16 * * 5' # Пятница 19:00 по МСК
  workflow_dispatch:

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install python-telegram-bot requests
      - name: Run Weather
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
        run: python bot.py --weather
