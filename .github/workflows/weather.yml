name: Saturday Morning Weather Forecast

on:
  schedule:
    - cron: '30 2 * * 6' # Каждую субботу в 05:30 по МСК (02:30 UTC)
  workflow_dispatch: # Чтобы можно было запустить вручную для теста

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install python-telegram-bot requests pytz
      - name: Run Weather
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
        run: python bot.py --weather
