name: 5Verst Full Automation

on:
  schedule:
    - cron: '0 5 * * 6'         # Сб 08:00 МСК — Погода
    - cron: '*/20 7-10 * * 6'   # Сб 10:00-13:00 МСК — Результаты
    - cron: '0 11 * * 6'        # Сб 14:00 МСК — Титулы
    - cron: '5 6 * * *'         # Каждый день 09:05 МСК — Дни рождения
    - cron: '0 */6 * * *'       # Каждые 6 часов — Подписчики ВК
    - cron: '0 15 * * 5'        # Пт 18:00 МСК — Статус ВК и Титулы
    - cron: '0 18 * * 0'        # Вс 21:00 МСК — Итоги недели
  workflow_dispatch:
    inputs:
      action:
        description: 'Выберите действие для запуска'
        required: true
        default: 'all_critical'
        type: choice
        options:
          - all_critical
          - titles
          - results
          - weather
          - send_button
          - vk_check

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install python-telegram-bot requests pandas beautifulsoup4 pytz

      - name: Run Task
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          FLUD_THREAD_ID: ${{ secrets.FLUD_THREAD_ID }}
          ORGS_CHAT_ID: ${{ secrets.ORGS_CHAT_ID }}
          NRMS_USERNAME: ${{ secrets.NRMS_USERNAME }}
          NRMS_PASSWORD: ${{ secrets.NRMS_PASSWORD }}
          SHEET_BASE_URL: ${{ secrets.SHEET_BASE_URL }}
          SHEET_FORM_URL: ${{ secrets.SHEET_FORM_URL }}
          SHEET_BIRTHDAYS_URL: ${{ secrets.SHEET_BIRTHDAYS_URL }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "Triggered by Schedule: ${{ github.event.schedule }}"
            case "${{ github.event.schedule }}" in
              "0 5 * * 6") python bot.py --weather ;;
              "*/20 7-10 * * 6") python bot.py --results ;;
              "0 11 * * 6") python bot.py --titles ;;
              "5 6 * * *") python bot.py --birthdays-auto ;;
              "0 */6 * * *") python bot.py --vk-check ;;
              "0 15 * * 5") python bot.py --vk-update && python bot.py --titles ;;
              "0 18 * * 0") python bot.py --stats ;;
            esac
          else
            echo "Triggered Manually. Action: ${{ github.event.inputs.action }}"
            case "${{ github.event.inputs.action }}" in
              "titles") python bot.py --titles ;;
              "results") python bot.py --results ;;
              "weather") python bot.py --weather ;;
              "send_button") python bot.py --send-button ;;
              "vk_check") python bot.py --vk-check ;;
              "all_critical" | *) 
                python bot.py --results
                python bot.py --titles
                ;;
            esac
          fi

      - name: Save Changes to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 5verst_cache.json last_report.txt vk_members.json || true
          if git commit -m "Auto-update logs and cache [skip ci]"; then
            git push
          else
            echo "No changes to commit"
          fi
