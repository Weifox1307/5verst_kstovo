name: Update 5Verst Titles

on:
  schedule:
    - cron: '0 11 * * 6' # Суббота 14:00 МСК
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install python-telegram-bot requests pandas

      - name: Run Title Updater
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NRMS_USERNAME: ${{ secrets.NRMS_USERNAME }}
          NRMS_PASSWORD: ${{ secrets.NRMS_PASSWORD }}
          SHEET_BASE_URL: ${{ secrets.SHEET_BASE_URL }}
          SHEET_FORM_URL: ${{ secrets.SHEET_FORM_URL }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
        run: python bot.py --titles 

      - name: Save Cache to Repo
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add 5verst_cache.json
          git commit -m "Auto-update cache" || echo "No changes"
          git push
