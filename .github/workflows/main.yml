name: Update 5Verst Titles and Results

on:
  schedule:
    - cron: '0 11 * * 6'      # Суббота 14:00 МСК (Титулы)
    - cron: '*/20 7-10 * * 6' # Суббота с 10:00 до 13:00 МСК каждые 20 минут (Результаты)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install python-telegram-bot requests pandas beautifulsoup4 pytz

      - name: Run Title Updater
        if: github.event.schedule == '0 11 * * 6' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NRMS_USERNAME: ${{ secrets.NRMS_USERNAME }}
          NRMS_PASSWORD: ${{ secrets.NRMS_PASSWORD }}
          SHEET_BASE_URL: ${{ secrets.SHEET_BASE_URL }}
          SHEET_FORM_URL: ${{ secrets.SHEET_FORM_URL }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
        run: python bot.py --titles 

      - name: Run Results Checker
        if: contains(github.event.schedule, '*/20') || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NRMS_USERNAME: ${{ secrets.NRMS_USERNAME }}
          NRMS_PASSWORD: ${{ secrets.NRMS_PASSWORD }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
        run: python bot.py --results

      - name: Save Changes to Repo
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add 5verst_cache.json last_report.txt || echo "No files to add"
          git commit -m "Auto-update cache and logs" || echo "No changes to commit"
          git push || echo "Nothing to push"
