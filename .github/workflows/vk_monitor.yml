name: VK Monitor and Stats

on:
  schedule:
    - cron: '*/30 * * * *'  # Каждые 30 минут проверка ВК
    - cron: '0 17 * * 6'    # Суббота 20:00 МСК — Итоги недели
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install python-telegram-bot requests pandas beautifulsoup4 pytz
      
      - name: Check New Members
        if: github.event.schedule != '0 17 * * 6'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
        run: python bot.py --vk-check

      - name: Weekly Stats
        if: github.event.schedule == '0 17 * * 6' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          ORGS_CHAT_ID: ${{ secrets.ORGS_CHAT_ID }}
          NRMS_USERNAME: ${{ secrets.NRMS_USERNAME }}
          NRMS_PASSWORD: ${{ secrets.NRMS_PASSWORD }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
        run: python bot.py --stats

      - name: Update VK Next Start Date
        # Дополнительный запуск обновления статуса в субботу вечером для надежности
        if: github.event.schedule == '0 17 * * 6' || github.event_name == 'workflow_dispatch'
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: python bot.py --vk-update

      - name: Save VK Members Cache
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add vk_members.json || echo "No files to add"
          git commit -m "Update VK members cache" || echo "No changes to commit"
          git push || echo "Nothing to push"
