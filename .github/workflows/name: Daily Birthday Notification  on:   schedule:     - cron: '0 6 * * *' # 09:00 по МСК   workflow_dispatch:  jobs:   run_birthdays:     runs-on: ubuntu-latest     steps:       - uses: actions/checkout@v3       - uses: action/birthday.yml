name: Daily Birthday Notification

on:
  schedule:
    - cron: '0 6 * * *' # 09:00 по МСК
  workflow_dispatch:

jobs:
  run_birthdays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install python-telegram-bot requests pandas pytz
      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SHEET_BIRTHDAYS_URL: ${{ secrets.SHEET_BIRTHDAYS_URL }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
        run: python bot.py --birthdays
