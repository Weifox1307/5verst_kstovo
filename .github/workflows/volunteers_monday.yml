name: Monday Volunteer Reminder

on:
  schedule:
    # 06:00 UTC = 09:00 МСК
    - cron: '0 6 * * 1'
  workflow_dispatch: # Позволяет запустить вручную из вкладки Actions для теста

jobs:
  send_reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install python-telegram-bot

      - name: Run Volunteer Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          # Тот самый новый секрет со значением 5
          THREAD_ID_VOLUNTEERS: ${{ secrets.THREAD_ID_VOLUNTEERS }}
        run: python volunteers_reminder.py
