name: Birthdays Notification

on:
  schedule:
    - cron: '0 6 * * *' # Каждый день в 09:00 МСК
  workflow_dispatch:
    inputs:
      manual_mode:
        description: 'Режим запуска'
        required: true
        default: '--birthdays-auto'
        type: choice
        options:
          - '--birthdays-auto'
          - '--birthdays-month'
          - '--birthdays-week'
          - '--birthdays'

jobs:
  run_birthdays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install python-telegram-bot requests pandas pytz
      - name: Run Birthdays
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SHEET_BIRTHDAYS_URL: ${{ secrets.SHEET_BIRTHDAYS_URL }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            python bot.py ${{ github.event.inputs.manual_mode }}
          else
            python bot.py --birthdays-auto
          fi
