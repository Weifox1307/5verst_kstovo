<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 вёрст Кстово</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #FF8D00;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>5 вёрст Кстово</h2>
        <p>Привязка ID и Дня рождения</p>
        
        <input type="number" id="v5_id" placeholder="ID 5 вёрст">
        <input type="text" id="birthday" placeholder="День рождения (ДД.ММ)">
        <input type="text" id="name" placeholder="Ваше Имя">
        
        <button id="sendData">Сохранить данные</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby-hKQSo_cUvsNBmwISGSPAwiWB7p_7X4L96OBn4m89gy1MsQ59TD8HXjV6jVCRoTDboA/exec";

        document.getElementById('sendData').addEventListener('click', () => {
            const v5_id = document.getElementById('v5_id').value.trim();
            const birthday = document.getElementById('birthday').value.trim();
            const name = document.getElementById('name').value.trim();
            const tg_user = tg.initDataUnsafe.user;

            if(!v5_id || !name) {
                tg.showAlert("Пожалуйста, заполни ID и Имя");
                return;
            }

            const payload = {
                tg_id: tg_user ? String(tg_user.id) : "unknown",
                username: tg_user && tg_user.username ? tg_user.username : "",
                v5_id: v5_id,
                name: name,
                birthday: birthday
            };

            const btn = document.getElementById('sendData');
            btn.disabled = true;
            btn.innerText = "Отправка...";

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                body: JSON.stringify(payload)
            })
            .then(() => {
                tg.showPopup({
                    title: 'Успешно!',
                    message: 'Данные отправлены!',
                    buttons: [{type: 'ok'}]
                }, () => {
                    tg.close();
                });
            })
            .catch(err => {
                alert("Ошибка: " + err);
                btn.disabled = false;
                btn.innerText = "Попробовать снова";
            });
        });
    </script>
</body>
</html>
