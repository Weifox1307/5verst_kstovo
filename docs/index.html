<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 вёрст | Регистрация</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --v5-orange: #FF8D00; --v5-dark: #2c2c2c; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #222);
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #fff);
            padding: 25px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px;
        }
        .header { text-align: center; margin-bottom: 25px; }
        .header img { width: 80px; }
        h2 { color: var(--v5-orange); margin: 10px 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input {
            width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px;
            box-sizing: border-box; outline: none; transition: 0.3s;
            background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color);
        }
        input:focus { border-color: var(--v5-orange); }
        .btn {
            background: var(--v5-orange); color: white; border: none;
            width: 100%; padding: 15px; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .hint { font-size: 12px; color: #888; margin-top: 5px; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>5 вёрст парк Юбилейный | Кстово</h2>
        <p>Привязка ID для титулов и ДР</p>
    </div>

    <div class="input-group">
        <label>ID 5 вёрст</label>
        <input type="number" id="v5_id" placeholder="Напр: 1007901">
    </div>

    <div class="input-group">
        <label>Дата рождения</label>
        <input type="text" id="birthday" placeholder="ДД.ММ (напр: 15.05)">
    </div>

    <div class="input-group">
        <label>Ваше имя</label>
        <input type="text" id="name" placeholder="Иван Иванов">
    </div>

    <button class="btn" id="sendData">Сохранить данные</button>
    <p class="hint">Ваш Telegram ID подтянется автоматически</p>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Развернуть на весь экран

    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwN6ncsOVOALR_UulOyMqaxd2pF5J_hZ48QrxdP5T4qQ7ubuVEWKwcRzwB4yUpXbKo/exec";

    document.getElementById('sendData').addEventListener('click', () => {
        const v5_id = document.getElementById('v5_id').value;
        const birthday = document.getElementById('birthday').value;
        const name = document.getElementById('name').value;
        const tg_user = tg.initDataUnsafe.user;

        if(!v5_id || !name) {
            alert("Пожалуйста, заполни ID и Имя");
            return;
        }

        const payload = {
            tg_id: tg_user ? tg_user.id : "unknown",
            v5_id: v5_id,
            name: name,
            birthday: birthday
        };

        // Отправляем данные в Google Таблицу
        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(() => {
            tg.showPopup({
                title: 'Готово!',
                message: 'Твои данные успешно привязаны. Титул обновится автоматически.',
                buttons: [{type: 'ok'}]
            }, () => {
                tg.close();
            });
        })
        .catch(err => alert("Ошибка: " + err));
    });
</script>

</body>
</html>
