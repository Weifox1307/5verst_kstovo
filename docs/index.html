<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 вёрст Кстово</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { color: #FF8D00; margin-top: 0; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 14px; font-weight: bold; margin-left: 5px; }
        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 12px;
            box-sizing: border-box;
            background: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 16px;
            background-color: #FF8D00;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:disabled { opacity: 0.5; }
    </style>
</head>
<body>
    <div class="container">
        <h2>5 вёрст Кстово</h2>
        <p style="font-size: 14px; margin-bottom: 20px;">Привязка ID и Дня рождения</p>
        
        <div class="input-group">
            <label>ID 5 вёрст</label>
            <input type="text" id="v5_id" placeholder="Напр: A790217375 или 790217375">
        </div>

        <div class="input-group">
            <label>День рождения</label>
            <input type="text" id="birthday" placeholder="ДД.ММ или ДД.ММ.ГГГГ">
        </div>

        <div class="input-group">
            <label>Ваше Имя</label>
            <input type="text" id="name" placeholder="Иван Иванов">
        </div>
        
        <button id="sendData">Сохранить данные</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw5okZ40OAjR83-nIt47OnqTmaFV44rFMFC9LN22FA8adI26iSxqvZWMojDWTEtRDZE/exec";

        document.getElementById('sendData').addEventListener('click', function() {
            let rawV5Id = document.getElementById('v5_id').value.trim();
            const birthday = document.getElementById('birthday').value.trim();
            const name = document.getElementById('name').value.trim();
            const tg_user = tg.initDataUnsafe.user;

            if(!rawV5Id || !name) {
                tg.showAlert("Пожалуйста, заполни ID и Имя");
                return;
            }

            // Очистка ID: убираем букву A (английскую или русскую) и оставляем только цифры
            const cleanV5Id = rawV5Id.replace(/[AaАа]/g, '');

            const payload = {
                tg_id: tg_user ? String(tg_user.id) : "unknown",
                username: tg_user && tg_user.username ? tg_user.username : "",
                v5_id: cleanV5Id,
                name: name,
                birthday: birthday
            };

            const btn = this;
            btn.disabled = true;
            btn.innerText = "Отправка...";

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                body: JSON.stringify(payload)
            })
            .then(() => {
                tg.showPopup({
                    title: 'Успешно!',
                    message: 'Данные отправлены! ID записан без буквы А для корректной работы титулов.',
                    buttons: [{type: 'ok'}]
                }, () => {
                    tg.close();
                });
            })
            .catch(err => {
                tg.showAlert("Ошибка: " + err);
                btn.disabled = false;
                btn.innerText = "Попробовать снова";
            });
        });
    </script>
</body>
</html>
