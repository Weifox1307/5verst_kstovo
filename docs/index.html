<script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Развернуть на весь экран
    tg.ready();

    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby-hKQSo_cUvsNBmwISGSPAwiWB7p_7X4L96OBn4m89gy1MsQ59TD8HXjV6jVCRoTDboA/exec";

    document.getElementById('sendData').addEventListener('click', () => {
        const v5_id = document.getElementById('v5_id').value.trim();
        const birthday = document.getElementById('birthday').value.trim();
        const name = document.getElementById('name').value.trim();
        const tg_user = tg.initDataUnsafe.user;

        if(!v5_id || !name) {
            tg.showAlert("Пожалуйста, заполни ID 5 вёрст и Имя");
            return;
        }

        const payload = {
            tg_id: tg_user ? String(tg_user.id) : "unknown",
            username: tg_user && tg_user.username ? tg_user.username : "",
            v5_id: v5_id,
            name: name,
            birthday: birthday
        };

        // Визуальная обратная связь
        const btn = document.getElementById('sendData');
        btn.disabled = true;
        btn.innerText = "Отправка...";

        // Отправляем данные в Google Таблицу
        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', // Важно для Google Scripts
            cache: 'no-cache',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            tg.showPopup({
                title: 'Успешно!',
                message: 'Твои данные разложены по полочкам: ID привязан, а день рождения записан. Титул обновится при следующем запуске бота.',
                buttons: [{type: 'ok', text: 'Круто!'}]
            }, () => {
                tg.close();
            });
        })
        .catch(err => {
            btn.disabled = false;
            btn.innerText = "Попробовать снова";
            alert("Ошибка отправки: " + err);
        });
    });
</script>
